name: Security Vulnerability Check

on:
  push:
    branches-ignore:
      - renovate/**
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yaml'
      - '.github/workflows/security.yaml'
  schedule:
    - cron: '45 8 * * 5'

jobs:
  vulnerability-scan:
    permissions:
      issues: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: trim21/actions/setup-go@master

      - run: sudo apt update
      - run: sudo apt install libgpgme-dev libassuan-dev libbtrfs-dev libdevmapper-dev pkg-config -y

      - run: go run golang.org/x/vuln/cmd/govulncheck ./... 2>&1 | tee /tmp/govulncheck.log

      - name: Notify failed build
        if: failure()
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const label = 'vulncheck';
            const { owner, repo } = context.repo;

            let log = '';
            try {
              log = fs.readFileSync('/tmp/govulncheck.log', 'utf8').trim();
            } catch (e) {
              // govulncheck 之前的步骤失败时没有 log 文件
            }
            if (log.length > 50000) {
              log = log.slice(0, 50000) + '\n... (truncated)';
            }

            const ref = context.ref.replace('refs/heads/', '');
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            let body = `GitHub Actions workflow [${context.workflow} #${context.runNumber}](${runUrl}) failed.\n\nEvent: ${context.eventName}\nBranch: [${ref}](https://github.com/${owner}/${repo}/tree/${ref})\nCommit: [${context.sha}](https://github.com/${owner}/${repo}/commit/${context.sha})`;
            if (log) {
              body += `\n\n<details><summary>govulncheck output</summary>\n\n\`\`\`\n${log}\n\`\`\`\n\n</details>`;
            }

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, labels: label, state: 'open', per_page: 100 }
            );
            const existing = issues.sort((a, b) => b.number - a.number)[0];
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: 'Failed build: Security Vulnerability Check', body, labels: [label] });
            }

      - name: Close resolved vulnerability issues
        if: success()
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const label = 'vulncheck';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, labels: label, state: 'open', per_page: 100 }
            );
            for (const issue of issues) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
            }
